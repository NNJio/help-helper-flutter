name: help_helper
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.0.0
  flutter_screenutil: ^5.9.3
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^6.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^4.0.0




flutter:


  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/splash/
    - assets/icons/


  fonts:
    - family: RSU
      fonts:
        - asset: assets/fonts/RSU_Regular.ttf
          weight: 400
        - asset: assets/fonts/RSU_light.ttf
          weight: 300
        - asset: assets/fonts/RSU_BOLD.ttf
          weight: 700

